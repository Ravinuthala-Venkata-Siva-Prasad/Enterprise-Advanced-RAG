llm:
  provider: chatgpt
  model_name: gpt-4.1
  temperature: 0.1
  max_tokens: 2048

embeddings:
  provider: huggingface
  model_name: sentence-transformers/all-MiniLM-L6-v2
  device: cpu

retrieval:
  vector_top_k: 10
  reranker_tok_k: 5

reranker:
  provider: cross_encoder
  model_name: cross_encoder/ms-macro-MiniLM-L-6-v2