project:
  name: Enterprise-Advanced-RAG
  version: 1.0.0
  environment: development

paths:
  raw_data: data/raw
  processed_data: data/processed
  embeddings: data/embeddings
  evaluation: data/evaluation
  logs: reports/logs

document_processing:
