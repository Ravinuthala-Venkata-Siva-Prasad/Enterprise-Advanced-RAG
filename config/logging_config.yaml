version: 1

disable_existing_loggers: false

formatters:
  
  standard:
    format: "%(asctime)s | %(name)s | %(levelname)s | %(message)s"

handlers:
  
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard

loggers:

  EnterpriseRAG:
    level: INFO
    handlers:
      - console
    propagate: false

root:
  level: INFO
  handlers:
    - console   