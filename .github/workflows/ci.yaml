
name: Enterprise Advanced RAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU-only Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          tags: enterprise-advanced-rag:ci
          load: true

      - name: Verify CPU-only PyTorch
        run: |
          docker run --rm --entrypoint python enterprise-advanced-rag:ci -c "import torch; print(torch.__version__); assert torch.version.cuda is None"

      - name: Verify API and frontend
        run: |
          docker run --rm --entrypoint python enterprise-advanced-rag:ci -c "from api.main import build_production_app; from frontend.api_client import RAGAPIClient; print('Imports successful')"

      - name: CI successful
        run: echo "Enterprise Advanced RAG CI passed"
