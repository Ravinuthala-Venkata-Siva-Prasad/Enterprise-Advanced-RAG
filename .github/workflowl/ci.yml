
name: Enterprise Advanced RAG - CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU-only Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.cpu
          tags: enterprise-advanced-rag:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PyTorch CPU installation
        run: |
          docker run --rm --entrypoint python enterprise-advanced-rag:ci -c "
          import torch
          print('PyTorch:', torch.__version__)
          print('CUDA:', torch.version.cuda)
          assert torch.version.cuda is None
          print('CPU-only verification passed')
          "

      - name: Verify API and frontend imports
        run: |
          docker run --rm --entrypoint python enterprise-advanced-rag:ci -c "
          from api.main import build_production_app
          from frontend.api_client import RAGAPIClient
          print('API and frontend imports successful')
          "

      - name: CI completed
        run: echo "Enterprise Advanced RAG CI passed!"
