
services:
  api:
    image: enterprise-advanced-rag:v2
    container_name: enterprise-rag-api
    command:
      - uvicorn
      - api.main:build_production_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - rag_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  frontend:
    image: enterprise-advanced-rag:v2
    container_name: enterprise-rag-frontend
    command:
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_data:
    external: true
    name: enterprise_rag_data
